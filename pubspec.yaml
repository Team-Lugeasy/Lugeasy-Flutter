name: lugeasy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  provider: ^6.0.5
  flutter_riverpod: ^2.3.1
  riverpod_annotation: any
  flutter_screenutil: ^5.7.0
  cupertino_icons: ^1.0.8
  sign_in_with_apple: ^5.0.0
  google_sign_in: ^6.2.2
  json_annotation: ^4.8.0
  intl: 0.19.0
  table_calendar: ^3.1.3
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.9
  permission_handler: ^11.0.0
  http: ^1.3.0
  http_interceptor: ^2.0.0
  logger: ^2.0.2
  flutter_naver_map: ^1.3.1
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  build_runner: ^2.4.11
  json_serializable: ^6.6.1

flutter:
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
  assets:
  - ./env/.env
  - assets/icon_luggage_off.svg
  - assets/icon_luggage_on.svg
  - assets/icon_map_on.svg
  - assets/icon_map_off.svg
  - assets/icon_profile_on.svg
  - assets/icon_profile_off.svg
  - assets/icon_marker.png
  - assets/icon_search.svg
  - assets/icon_notification_unread.svg
  uses-material-design: true
  generate: true
